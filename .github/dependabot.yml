version: 2
multi-ecosystem-groups:
  daily-dependencies:
    schedule:
      interval: daily
updates:
  - package-ecosystem: npm
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: daily-dependencies
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/playground
    patterns:
      - "*"
    multi-ecosystem-group: daily-dependencies
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /apps/next-vercel-supabase-app
    patterns:
      - "*"
    multi-ecosystem-group: daily-dependencies
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    patterns:
      - "*"
    multi-ecosystem-group: daily-dependencies
    open-pull-requests-limit: 5
