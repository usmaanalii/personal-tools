name: Playwright E2E Tests

on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'apps/playground/**'
      - 'supabase/functions/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.nvmrc'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      deployment_url:
        description: 'Optional deployment root URL, including prefix and trailing slash'
        required: false
        type: string

permissions:
  contents: read

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            e2e:
              - 'apps/playground/**'
              - 'supabase/functions/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - '.github/workflows/e2e.yml'

  playwright:
    needs: changes
    if: always() && (github.event_name != 'pull_request' || (needs.changes.result == 'success' && needs.changes.outputs.e2e == 'true'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 9.5.0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium system dependencies
        run: pnpm --filter playground exec playwright install-deps chromium
      - name: Install Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter playground exec playwright install chromium
      - name: Page integration tests (Vitest)
        run: pnpm test
      - name: Edge Function API contract tests (Vitest)
        run: pnpm test:functions
      - name: Production static-site routing and layout smoke (fixture content)
        run: pnpm test:e2e
      - name: Deployment browser smoke (no asset or backend mocks)
        if: github.event_name == 'workflow_dispatch' && inputs.deployment_url != ''
        env:
          PLAYWRIGHT_BASE_URL: ${{ inputs.deployment_url }}
        run: pnpm --filter playground test:smoke
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/playground/playwright-report/
            apps/playground/test-results/
          retention-days: 7
