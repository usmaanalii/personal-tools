name: Verify and release one Vercel app

on:
  workflow_call:
    inputs:
      project:
        required: true
        type: string
      environment:
        required: true
        type: string
      node:
        required: true
        type: string

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: ${{ inputs.project }} quality and E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: vercel-quality-${{ inputs.project }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint, formatting, strict types, integration coverage and catalogue
        run: node scripts/releases/commands.mjs "$PROJECT" quality
        env:
          PROJECT: ${{ inputs.project }}
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: apps/*/.next/cache
          key: fixture-build-${{ inputs.project }}-${{ runner.os }}-${{ inputs.node }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/next.config.*') }}-${{ github.sha }}
          restore-keys: fixture-build-${{ inputs.project }}-${{ runner.os }}-${{ inputs.node }}-${{ hashFiles('pnpm-lock.yaml', 'apps/**/next.config.*') }}-
      - name: Install Chromium
        run: node scripts/releases/commands.mjs "$PROJECT" browserInstall
        env:
          PROJECT: ${{ inputs.project }}
      - name: Production-build browser smoke with a local backend fixture
        run: node scripts/releases/commands.mjs "$PROJECT" browser
        env:
          PROJECT: ${{ inputs.project }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: ${{ !cancelled() }}
        with:
          name: ${{ inputs.project }}-quality-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            apps/*/coverage/
            apps/*/playwright-report/
            apps/*/test-results/
          retention-days: 7

  release:
    name: ${{ inputs.project }} verified production release
    needs: quality
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ inputs.environment }}
    concurrency:
      group: vercel-production-${{ inputs.project }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ inputs.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install reviewed deployment CLI
        run: npm install --global vercel@65.8.0
      - name: Install Chromium
        run: node scripts/releases/commands.mjs "$PROJECT" browserInstall
        env:
          PROJECT: ${{ inputs.project }}
      - name: Stage, verify, promote, and verify production
        run: node scripts/releases/run.mjs "$PROJECT"
        env:
          PROJECT: ${{ inputs.project }}
          GH_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - name: Retain sanitised release identity and phase only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: ${{ inputs.project }}-release-${{ github.sha }}-${{ github.run_attempt }}
          path: release-evidence/release.json
          retention-days: 30
