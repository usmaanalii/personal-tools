name: Deploy to GitHub Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_backend:
        description: Redeploy and verify both Edge Functions even when the backend inputs match the last verified release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  queue: max
  cancel-in-progress: false

jobs:
  selection:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      backend: ${{ steps.select.outputs.backend }}
      pages: ${{ steps.select.outputs.pages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter personal-tools
      - id: select
        run: node scripts/pages-release/ci.mjs select
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE_BACKEND: ${{ inputs.force_backend }}

  build:
    name: Pages quality and routing
    needs: selection
    if: >-
      !cancelled() && (github.event_name == 'pull_request' ||
      (needs.selection.result == 'success' &&
      (needs.selection.outputs.backend == 'true' || needs.selection.outputs.pages == 'true')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm test:functions
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: '2.9.6'
      - run: pnpm --filter edge-functions check:deno
      - run: node --test scripts/pages-release/*.test.mjs
      - name: Build the complete Pages artifact
        run: pnpm build:pages
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      - name: Install Chromium
        run: pnpm --filter playground exec playwright install --with-deps chromium
      - name: Verify the complete artifact under the deployment prefix
        run: pnpm test:pages
      - name: Verify catalogue component presentation
        run: pnpm test:catalogue
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        if: needs.selection.outputs.pages == 'true'
        with:
          path: apps/playground/dist

  backend:
    name: Deploy and verify Supabase Edge Functions
    needs: [selection, build]
    if: >-
      github.ref == 'refs/heads/main' && github.run_attempt == 1 &&
      needs.selection.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: supabase-production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 9.5.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generate licensed release assets
        run: |
          pnpm --filter playground quran:backend
          pnpm --filter playground lane:data
          pnpm --filter playground mufradat:data
          pnpm --filter playground exec node scripts/quran-data/coverage-index.mjs ../../supabase/functions/quran/coverage-data
      - uses: supabase/setup-cli@afb1b15109756ea5cf9d8985a359d9095235ca2b # v2.1.2
        with:
          version: '3.0.0'
      - name: Deploy both functions and verify the hosted API
        run: node scripts/pages-release/ci.mjs backend
        env:
          GH_TOKEN: ${{ github.token }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}

  gate:
    name: Require a verified backend before publishing Pages
    needs: [selection, build, backend]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      needs.selection.outputs.pages == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: node scripts/pages-release/ci.mjs gate
        env:
          SELECTION_RESULT: ${{ needs.selection.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BACKEND_REQUIRED: ${{ needs.selection.outputs.backend }}
          BACKEND_RESULT: ${{ needs.backend.result }}

  deploy:
    needs: gate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Require a fresh run at the current main revision
        run: node scripts/pages-release/ci.mjs current
        env:
          GH_TOKEN: ${{ github.token }}
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
