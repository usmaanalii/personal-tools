name: Vercel workspace apps

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      deployments: read
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      any: ${{ steps.select.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
      - name: Test release safety policies
        run: node --experimental-strip-types --test scripts/releases/*.test.mjs
      - id: select
        name: Select affected projects (fail open to checks, never skip on uncertainty)
        run: node scripts/releases/select.mjs
        env:
          GH_TOKEN: ${{ github.token }}

  app:
    needs: changes
    if: needs.changes.outputs.any == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    uses: ./.github/workflows/vercel-app.yml
    # Name the two secrets here so the release job can read their values from
    # its GitHub environment. This does not pass every repository secret.
    secrets:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
    with:
      project: ${{ matrix.key }}
      environment: ${{ matrix.environment }}
      node: ${{ matrix.node }}

  required:
    name: Next.js quality and E2E
    needs: [changes, app]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require successful checks or an intentionally unaffected project set
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app.result }}
        run: |
          test "$SELECTION_RESULT" = success
          test "$APP_RESULT" = success || test "$APP_RESULT" = skipped
